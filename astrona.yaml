        title: "Project Robots And System Robots"
        path: sections/section-030/module-01/course-01-project-robots-and-system-robots.md
      - type: reading
        title: "Least Privilege, Expiry And Rotation"
        path: sections/section-030/module-01/course-02-least-privilege-expiry-and-rotation.md
      - type: reading
        title: Question
        path: sections/section-030/module-01/labs/lab-01/question.md
      - type: lab
        title: "Create A Push-Only Robot For CI Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: robot-accounts
        task_kind: build
        tags: [robot-account, project-robot, robot-permissions, least-privilege, kubernetes-secret, oras]
        learning_goals:
          - Create a project robot with only repository push and pull and a 30-day expiry
          - Store the robot's name and secret in a Kubernetes Secret
          - Prove the robot can push to its own project and nowhere else
        resources:
          - name: "Create project robot accounts"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/project-configuration/create-robot-accounts/
          - name: "Robot accounts (system level)"
            url: https://goharbor.io/docs/2.15.0/administration/robot-accounts/
          - name: "harbor project robot create"
            url: https://github.com/goharbor/harbor-cli/blob/v0.0.27/doc/cli-docs/harbor-project-robot-create.md
      - type: reading
        title: Summary
        path: sections/section-030/module-01/course-03-summary.md

      - type: reading
        title: Question
        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Rotate A Leaked Robot Secret Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: robot-accounts
        task_kind: troubleshooting
        tags: [robot-account, secret-rotation, least-privilege, robot-permissions, kubernetes-secret, oras]
        learning_goals:
          - Refresh a leaked robot secret so the old one stops working
          - Reduce an over-privileged robot to pull only, with an expiry, without recreating it
          - Prove the new secret pulls, a push is refused and the leaked secret is dead
        resources:
          - name: "Create project robot accounts"
            url: https://goharbor.io/docs/2.15.0/working-with-projects/project-configuration/create-robot-accounts/
