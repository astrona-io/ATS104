# Report Every Repository In A Project
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-104-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Harbor 2.15.4 with Helm, the workstation and python-runner pods and the webhook receiver, and signs the harbor CLI in"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-104-lab-020-01-setup"
      description: "Pushes twelve repositories (thirteen artifacts) into inventory and two into archive"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until every Harbor component reports healthy and the pods are ready"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-script-is-safe"
      description: "Confirms /work/report.py exists, keeps TLS verification on and holds no password"
      type: "file"
      source: "validation/validate-script-is-safe.sh"
    - name: "validate-report-inventory"
      description: "Runs report.py for inventory and compares it with the API"
      type: "file"
      source: "validation/validate-report-inventory.sh"
    - name: "validate-report-archive"
      description: "Runs report.py for archive and checks it reports that project only"
      type: "file"
      source: "validation/validate-report-archive.sh"

teardown:
  keepCluster: false
