# Repair An Onboarding Script That Breaks In CI
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-104-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Harbor 2.15.4 with Helm, the workstation and python-runner pods and the webhook receiver, and signs the harbor CLI in"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-104-capstone-010-setup"
      description: "Creates team-red and red-dev, and writes /work/teams.csv and the broken /work/onboard-teams.sh"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until every Harbor component reports healthy and the pods are ready"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-script-uses-context"
      description: "Confirms the script holds no password, does not call harbor login, and switches to the saved context ci, which exists for admin"
      type: "file"
      source: "validation/validate-script-uses-context.sh"
    - name: "validate-runs-twice"
      description: "Runs the script twice the way CI does, with no terminal and no administrator password, and checks both runs succeed with the context ci"
      type: "file"
      source: "validation/validate-runs-twice.sh"
    - name: "validate-every-team"
      description: "Confirms every team in teams.csv is a private project with exactly one Developer member"
      type: "file"
      source: "validation/validate-every-team.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - mendhak/http-https-echo:42
      - python:3.13-alpine
