# Rotate A Leaked Robot Secret
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-104-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Harbor 2.15.4 with Helm, the workstation and python-runner pods and the webhook receiver, and signs the harbor CLI in"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-104-capstone-030-setup"
      description: "Creates an over-privileged robot robot$inventory+deployer and leaks its secret in the ConfigMap leaked-credentials"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until every Harbor component reports healthy and the pods are ready"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-same-robot"
      description: "Confirms robot$inventory+deployer still has its original ID"
      type: "file"
      source: "validation/validate-same-robot.sh"
    - name: "validate-least-privilege"
      description: "Confirms the robot can only pull from inventory and expires after 90 days"
      type: "file"
      source: "validation/validate-least-privilege.sh"
    - name: "validate-old-secret-revoked"
      description: "Confirms the leaked secret no longer signs in"
      type: "file"
      source: "validation/validate-old-secret-revoked.sh"
    - name: "validate-new-secret"
      description: "Uses the Secret deployer-robot to pull from inventory and checks a push is refused"
      type: "file"
      source: "validation/validate-new-secret.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
      - mendhak/http-https-echo:42
      - python:3.13-alpine
